<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#2D5BFF"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Caderneta"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%226%22 width=%2220%22 height=%2220%22 rx=%225%22 fill=%22%232D5BFF%22/%3E%3Crect x=%2216%22 y=%226%22 width=%2212%22 height=%2220%22 rx=%225%22 fill=%22%23FF6A2B%22/%3E%3C/svg%3E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Caderneta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de uma coluna no celular (lançamento no topo, abas embaixo);
   no desktop, duas colunas. Paleta: azul cobalto + laranja tangerina (complementares:
   confiança + energia), apoiados por violeta, âmbar, menta, céu e rosa para as categorias.
   Texto em azul-marinho, nunca preto puro. Vermelho fica só para alerta. */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --sunk:#E9EDF6; --ink:#141B34; --muted:#5E6784; --line:#DCE1EE;
  --blue:#2D5BFF; --blue-deep:#1A3FD6; --blue-soft:#E2E9FF;
  --tang:#FF6A2B; --tang-soft:#FFE7DC;
  --violet:#7B5CF5; --violet-soft:#ECE6FF;
  --amber:#F2A007; --amber-soft:#FFF1D2;
  --mint:#12B07F; --mint-soft:#D8F4E9;
  --sky:#119FE3; --pink:#E9468A; --teal:#0E9E9B;
  --danger:#E0363B; --danger-soft:#FDE3E3;
  --hero-a:#2D5BFF; --hero-b:#1C3ED0; --hero-ink:#FFFFFF;
  /* nomes antigos apontando para a paleta nova */
  --green:var(--blue); --green-2:var(--mint); --green-soft:var(--blue-soft);
  --gold:var(--amber); --gold-soft:var(--amber-soft);
  --orange:var(--danger); --orange-soft:var(--danger-soft);
  --on-accent:#FFFFFF;
  --f-ui:"Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:14px; --r-sm:8px;
}
:root[data-tema="escuro"]{
  --bg:#0B1020; --surface:#131A2E; --sunk:#1B2339; --ink:#E8ECF7; --muted:#97A0BC; --line:#252F4A;
  --blue:#5C82FF; --blue-deep:#3F66F0; --blue-soft:#1C2A55;
  --tang:#FF7E45; --tang-soft:#3A2218;
  --violet:#9A82FF; --violet-soft:#2A2350;
  --amber:#FFB534; --amber-soft:#3A2D10;
  --mint:#2FCB97; --mint-soft:#103629;
  --sky:#3DB5F0; --pink:#F2679F; --teal:#2BB8B4;
  --danger:#FF5A5E; --danger-soft:#3D1A1D;
  --hero-a:#2A4FE8; --hero-b:#16278A; --on-accent:#FFFFFF; color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root[data-tema="auto"]{
  --bg:#0B1020; --surface:#131A2E; --sunk:#1B2339; --ink:#E8ECF7; --muted:#97A0BC; --line:#252F4A;
  --blue:#5C82FF; --blue-deep:#3F66F0; --blue-soft:#1C2A55;
  --tang:#FF7E45; --tang-soft:#3A2218;
  --violet:#9A82FF; --violet-soft:#2A2350;
  --amber:#FFB534; --amber-soft:#3A2D10;
  --mint:#2FCB97; --mint-soft:#103629;
  --sky:#3DB5F0; --pink:#F2679F; --teal:#2BB8B4;
  --danger:#FF5A5E; --danger-soft:#3D1A1D;
  --hero-a:#2A4FE8; --hero-b:#16278A; --on-accent:#FFFFFF; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 96px}
@media (min-width:900px){body{padding-block:0 40px}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1120px;margin:0 auto}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px;padding-bottom:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;gap:12px;max-width:1120px;margin:0 auto}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--green);display:inline-block;transform:rotate(45deg)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok b{background:var(--green-2)}
.sync.off b{background:var(--orange)}
.temabtn{margin-left:auto}
.month{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.month button{border:0;background:none;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);border-radius:999px}
.month button:hover{color:var(--ink)}
.month .lbl{font-family:var(--f-num);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;min-width:92px;text-align:center;background:none;border:0;width:auto;padding:0 4px;color:var(--ink)}
.tabs-top{display:none}
@media (min-width:900px){
  .tabs-top{display:flex;gap:2px;margin-left:24px}
  .tabs-top button{border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
  .tabs-top button[aria-current="page"]{background:var(--ink);color:var(--bg)}
}

/* lançamento rápido */
.quick{max-width:1120px;margin:10px auto 0}
.qbox{display:flex;align-items:stretch;gap:8px}
.qfield{flex:1;min-width:0;position:relative;display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);transition:border-color .15s}
.qfield:focus-within{border-color:var(--green)}
.qfield svg{flex:none;margin-left:12px;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:none;padding:13px 10px;font-size:16px;outline:none;resize:none;height:48px;line-height:22px;overflow:hidden}
#q::placeholder{color:var(--muted)}
.iconbtn{flex:none;width:48px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{border-color:var(--muted)}
.go{flex:none;border:0;border-radius:var(--r);background:var(--green);color:var(--on-accent);font-weight:700;padding:0 18px}
.go:disabled{opacity:.35;cursor:default}
.preview{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;min-height:30px;font-size:13.5px}
.preview .hint{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--ink);border:1px solid transparent}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.o{background:var(--orange-soft);color:var(--orange)}
.pill.y{background:var(--gold-soft);color:var(--gold)}
.pill select{border:0;background:none;font-weight:600;font-size:12.5px;padding:0;appearance:none;-webkit-appearance:none;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.essencial{background:var(--green)} .dot.estilo{background:var(--ink)} .dot.assin{background:var(--gold)} .dot.outros{background:var(--muted)}

/* layout das views */
main{max-width:1120px;margin:18px auto 0}
.grid{display:grid;gap:18px}
@media (min-width:900px){.grid.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.col{display:grid;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-h .act{font-size:13px;color:var(--green);font-weight:600;background:none;border:0;padding:0}

/* herói */
.hero{padding:6px 2px 4px}
.big{font-family:var(--f-num);font-weight:600;font-size:clamp(38px,9vw,56px);line-height:1;letter-spacing:-.04em;margin:8px 0 10px;font-variant-numeric:tabular-nums}
.big .c{font-size:.45em;letter-spacing:0;color:var(--muted);margin-right:4px;vertical-align:.55em}
.big.neg{color:var(--orange)}
.sub{color:var(--muted);font-size:14.5px;max-width:52ch}
.sub b{color:var(--ink);font-family:var(--f-num);font-weight:600;font-size:14px}
.split{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:18px 0 8px;background:var(--sunk);gap:2px}
.split span{display:block;height:100%;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:18px 0 0}
.kpis div{background:var(--surface);padding:12px 12px 11px;min-width:0}
.kpis dt{font-size:12px;color:var(--muted);font-weight:600}
.kpis dd{margin:4px 0 0;font-family:var(--f-num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis small{display:block;font-family:var(--f-ui);font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}

/* avisos */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 11px 0;overflow:hidden}
.alert::before{content:"";align-self:stretch;margin:-11px 0;background:var(--muted)}
.alert.crit::before{background:var(--orange)} .alert.warn::before{background:var(--gold)} .alert.good::before{background:var(--green-2)}
.alert p{margin:0;font-size:14px;min-width:0}
.alert p small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.alert button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.alert button:hover{border-color:var(--ink)}

/* checklists */
.check{display:grid;gap:2px}
.crow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.tick{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);background:none;display:grid;place-items:center;padding:0;color:var(--on-accent)}
.tick:hover{border-color:var(--green)}
.tick.on{background:var(--green);border-color:var(--green)}
.crow .nm{font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .nm small{color:var(--muted);font-size:12.5px;margin-left:6px}
.crow.done .nm{color:var(--muted)}
.crow .v{font-family:var(--f-num);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.crow.late .nm small{color:var(--orange);font-weight:600}
.inl{display:flex;gap:6px;align-items:center}
.inl input{width:96px;border:1.5px solid var(--green);border-radius:var(--r-sm);padding:4px 8px;background:var(--surface);font-family:var(--f-num);font-size:14px}
.inl button{border:0;background:var(--green);color:var(--on-accent);border-radius:var(--r-sm);padding:5px 10px;font-weight:700;font-size:13px}
.btn-line{margin-top:10px;width:100%;border:1px dashed var(--line);background:none;border-radius:var(--r-sm);padding:8px;color:var(--muted);font-weight:600;font-size:13px}
.btn-line:hover{color:var(--ink);border-color:var(--muted)}

/* envelopes */
.grp + .grp{margin-top:18px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:13px}
.grp-h b{font-weight:700}
.grp-h span{font-family:var(--f-num);color:var(--muted);font-size:12.5px}
.env{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 0 10px;border-top:1px solid var(--line)}
.env:hover .env-name{text-decoration:underline;text-underline-offset:3px}
.env-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.env-name{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.env-v{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.env-v b{color:var(--ink);font-weight:600}
.env.over .env-v b{color:var(--orange)}
.track{position:relative;height:6px;border-radius:3px;background:var(--sunk);margin-top:7px;overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--green)}
.env[data-g="estilo"] .fill{background:var(--ink)}
.env[data-g="assin"] .fill{background:var(--gold)}
.env[data-g="outros"] .fill{background:var(--muted)}
.env.over .fill{background:var(--orange)}
.track .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.55;border-radius:1px}
.env-tag{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:.02em}

/* extrato */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);border-radius:var(--r);padding:9px 12px;background:var(--surface)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sel{border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface);font-size:13.5px;max-width:100%}
.day{margin-top:16px}
.day:first-child{margin-top:0}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 2px 6px;border-bottom:1px solid var(--line)}
.day-h .num{font-weight:500}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px}
.tx:hover{background:var(--sunk)}
.tx .d{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m{grid-column:1;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);min-width:0;flex-wrap:wrap}
.tx .val{grid-row:1/span 2;grid-column:2;font-family:var(--f-num);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tx .val.in{color:var(--green)}
.tx .val.sv{color:var(--gold)}
.flag{color:var(--orange);font-weight:700}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tot-line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin:-4px 0 10px}

/* metas */
.goal-big{font-family:var(--f-num);font-size:clamp(30px,7vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1}
.goal-bar{height:22px;background:var(--sunk);border-radius:5px;overflow:hidden;position:relative;margin:16px 0 8px}
.goal-bar .f{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,color-mix(in srgb,var(--gold) 88%,var(--surface)) 10px 11px)}
.goal-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:10px;flex-wrap:wrap}
.goal-meta b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.fact{border-top:2px solid var(--ink);padding-top:8px}
.fact dt{font-size:12px;color:var(--muted);font-weight:600}
.fact dd{margin:3px 0 0;font-family:var(--f-num);font-size:18px;font-weight:600}
.fact dd small{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted);display:block}
.ledger{width:100%;border-collapse:collapse;font-size:13.5px}
.ledger td{padding:7px 4px;border-top:1px solid var(--line)}
.ledger td:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.ledger td:first-child{font-family:var(--f-num);color:var(--muted);font-size:12.5px;white-space:nowrap;width:1%}
.ledger tr.neg td:last-child{color:var(--orange)}
.scroll{max-height:340px;overflow:auto}

/* histórico */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;min-width:560px;width:100%;height:auto}
.chart text{font-family:var(--f-num);font-size:10px;fill:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .t{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--ink);border-radius:3px}
.hbar .num{font-size:13px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:var(--r);padding:11px 12px;background:var(--surface)}
.ask input:focus{border-color:var(--green);outline:none}
.answer{margin-top:12px;font-size:14.5px;white-space:pre-wrap;line-height:1.55}
.answer.wait{color:var(--muted)}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ajustes */
.form-rows{display:grid;gap:0}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow.fx{grid-template-columns:minmax(0,1.3fr) 96px 56px minmax(0,1fr) 34px}
.frow.rc{grid-template-columns:minmax(0,1fr) 110px 56px 34px}
.frow input,.frow select{width:100%;min-width:0;border:1px solid transparent;border-radius:var(--r-sm);padding:6px 8px;background:var(--sunk);font-size:14px}
.frow input:focus,.frow select:focus{border-color:var(--green);outline:none;background:var(--surface)}
.frow input.n{font-family:var(--f-num);text-align:right}
.frow .x{border:0;background:none;color:var(--muted);width:34px;height:30px;border-radius:var(--r-sm)}
.frow .x:hover{color:var(--orange);background:var(--orange-soft)}
.fhead{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding-bottom:4px}
@media (max-width:560px){
  .frow.fx{grid-template-columns:minmax(0,1fr) 84px 34px}
  .frow.fx .dia,.frow.fx .cat{display:none}
  .fhead.fx .dia,.fhead.fx .cat{display:none}
}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.toggle input{width:20px;height:20px;accent-color:var(--green)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

    const brutos = sm[2].split(/\s*;\s*|(?<!\d),\s*|,\s+|\s+e\s+|\s+mais\s+|(?=\s(?:r\$\s*)?\d)/i).map(x=>x.trim()).filter(Boolean);
    const partes = []; let pend = "";
    for (const x of brutos){ if (temNumero(x)){ partes.push((pend+" "+x).trim()); pend = ""; } else if (pend || !partes.length || /^(gastei|paguei|tirei|saquei|guardei|ganhei|recebi|comprei)\b/i.test(norm(x))) pend = (pend+" "+x).trim(); else partes[partes.length-1] += " " + x; }
    if (partes.length>=2) blocos = partes.map(x => (verbo && !/\b(recebi|ganhei|guardei|gastei|paguei|tirei|saquei)\b/i.test(norm(x)) ? verbo+" " : "") + x);
    else blocos = [sm[1]];
  }
  // separa por vírgula, ponto e vírgula, " e ", "mais", "depois", "também"
  const out = [];
  for (const b of blocos){
    const pedacos = b.split(/\s*;\s*|(?<!\d)\s*,\s*(?=\D*\d)|,\s+(?=\D*\d)|\s+e\s+(?=[^\d]*\d)|\s+mais\s+(?=[^\d]*\d)|\s+depois\s+|\s+tamb[eé]m\s+|\.\s+/i).map(x=>x.trim()).filter(Boolean);
    for (const pz of pedacos){ if (temNumero(pz) || !out.length) out.push(pz); else out[out.length-1] += " " + pz; }
  }
  return out.filter(temNumero);
}
function parseTexto(v){
  const linhas = v.split("\n").map(x=>x.trim()).filter(Boolean);
  const itens = [], falhas = [];
  for (const ln of linhas){
    const notif = parseNotificacao(ln);
    if (notif){ itens.push(finalizar(notif)); continue; }
    const partes = dividirFrase(ln);
    if (!partes.length){ falhas.push(ln); continue; }
    let anterior = null;
    for (const pt of partes){
      let p = parseLinha(pt);
      if (p && !p.explicito && anterior && anterior.tipo!=="gasto"){
        const verbo = {receita:"recebi", aporte:"guardei", resgate:"resgatei"}[anterior.tipo];
        const q = parseLinha(verbo+" "+pt); if (q) p = q;
      }
      if (p){ itens.push(p); anterior = p; } else falhas.push(pt);
    }
  }
  return {itens, falhas, linhas};
}

function hashL(d){ return d.data+"|"+Number(d.valorTotal||d.valor).toFixed(2)+"|"+keyOf(d.desc); }
const totalDe = d => +(d.valorTotal || d.valor) || 0;

async function lancarParsed(p, opts={}){
  const ids = [];
  if (p.tipo==="gasto" && !p.fixo && !opts.id && (p.parcelas||1)===1 && p.cartao && modoFatura()){ const mm = mesDe(p.data); const f = acharItemPrevisto(p.desc, mm, true);
    if (f){ p = Object.assign({}, p, {fixo:f.id, cat:f.cat, pagoEm: mm, naFatura:false}); opts = Object.assign({}, opts, {id:`fx-${f.id}-${mm}`}); p._ligouPrevisto = f.nome; } }
  if (p.tipo==="gasto" && !p.fixo && !opts.id && (p.parcelas||1)===1 && !p.cartao){ const f = acharItemPrevisto(p.desc, mesDe(p.data)); if (f){ p = Object.assign({}, p, {fixo:f.id, cat:f.cat, desc: p.desc}); opts = Object.assign({}, opts, {id:`fx-${f.id}-${mesDe(p.data)}`}); p._ligouPrevisto = f.nome; } }
  const n = Math.max(1, p.parcelas||1);
  const grupo = n>1 ? "p"+uid() : null;
  const each = n>1 ? r2(p.valor/n) : p.valor;
  for (let i=0;i<n;i++){
    const d = new Date(p.data+"T12:00:00"); d.setMonth(d.getMonth()+i);
    const doc = { data: isoDate(d), valor: (i===n-1 && n>1) ? r2(p.valor - each*(n-1)) : each, tipo:p.tipo, desc:p.desc,
      cat: p.tipo==="gasto" ? (p.cat||null) : (p.tipo==="receita" ? "__rec" : null),
      meta: p.meta || null, origem: p.origem||"rapido", revisar: p.tipo==="gasto" && !p.cat, criado: Date.now() };
    if (grupo){ doc.grupo = grupo; doc.parc = (i+1)+"/"+n; }
    else if (p.parcInfo) doc.parc = p.parcInfo;
    if (p.cartao && p.tipo==="gasto"){ doc.cartao = true; doc.fatura = addMes(p.fatura || faturaDe(p.data), i); }
    if (p.pagoEm && doc.cartao && n===1){ doc.pagoEm = p.pagoEm; if (p.aPagar) doc.aPagar = true; }
    else if (p.naFatura && doc.cartao) doc.naFatura = true;
    if (p.tipo==="pagfatura"){ doc.fatura = p.fatura || faturaDe(p.data); doc.cat = null; doc.revisar = false; }
    if (p.nota) doc.nota = String(p.nota).slice(0,300);
    if (n===1 && p.divide && +p.divide.valor>0 && p.tipo==="gasto"){ const parte = Math.min(+p.divide.valor, doc.valor); doc.valorTotal = doc.valor; doc.valor = r2(doc.valor - parte); doc.divide = {quem: String(p.divide.quem||"Alguém").slice(0,40), valor: r2(parte), recebido: false}; }
    if (p.fixo) doc.fixo = p.fixo;
    if (p.rec) doc.rec = p.rec;
    const recLivre = p.rec && ![...S.lanc.values()].some(x=>x.rec===p.rec && x.mes===mesDe(doc.data));
    doc.h = hashL(doc);
    const id = opts.id && n===1 ? opts.id : (recLivre && n===1 ? `rc-${p.rec}-${mesDe(doc.data)}` : "l"+uid()+i);
    if (p.rec && !recLivre && !opts.id) delete doc.rec;
    ids.push(id);
    await gravarLanc(id, doc);
  }
  return ids;
}

/* ---------- cálculos do mês ---------- */
/* Modo "fatura é um item só" (padrão): compras do cartão não entram no orçamento do mês.
   O que sai do mês é o pagamento da fatura (e adiantamentos). As compras ficam para análise. */
const modoFatura = () => S.cfg.faturaItem !== false;
function cartaoDoMes(m){
  // fatura que vence em m: só as compras que ainda não foram acertadas antes (as do dia a dia já pesaram e foram adiantadas no mês da compra)
  const prox = addMes(m,1), fi = faturaInfo(m);
  const naConta = fi.itens.filter(d=>d.mes===m), antes = fi.itens.filter(d=>d.mes<m);
  const auto = r2(sum(naConta, totalDe));
  const ov = S.cfg.planos?.[m]?.__cartao;
  const devido = ov!=null ? +ov||0 : auto;
  const pagoMes = sum([...S.lanc.values()].filter(d=>d.tipo==="pagfatura" && d.fatura===m && mesDe(d.data)===m), d=>d.valor);
  const pend = Math.max(0, r2(devido - pagoMes));
  // compras do cartão deste mês que você adianta (já contam nos gastos deste mês)
  const adiantarItens = [...S.lanc.values()].filter(d=>d.cartao && d.tipo==="gasto" && d.mes===m && d.fatura>m);
  const adiantarTot = r2(sum(adiantarItens, totalDe));
  const adiantadoMes = sum([...S.lanc.values()].filter(d=>d.tipo==="pagfatura" && d.fatura>m && mesDe(d.data)===m), d=>d.valor);
  const adiantar = Math.max(0, r2(adiantarTot - adiantadoMes));
  return {m, prox, fi, devido, auto, manual: ov!=null, pagoMes, pend, adiantar, adiantarTot, adiantadoMes, nAntes: antes.length, totAntes: r2(sum(antes, totalDe)), nItens: naConta.length};
}
function lancDoMes(m){ return [...S.lanc.entries()].filter(([,d])=>d.mes===m).map(([id,d])=>Object.assign({id},d)); }
function resumo(m){
  const L = lancDoMes(m);
  const MF = modoFatura(), CM = MF ? cartaoDoMes(m) : null;
  const gastos = L.filter(d=>d.tipo==="gasto" && !(MF && d.cartao && d.mes===d.fatura)), receitas = L.filter(d=>d.tipo==="receita");
  const aportes = L.filter(d=>d.tipo==="aporte"), resgates = L.filter(d=>d.tipo==="resgate");
  const saiuCartao = MF ? CM.pagoMes : 0;
  const entrou = sum(receitas,d=>d.valor), saiu = sum(gastos,d=>d.valor) + saiuCartao;
  const cartPend = MF ? CM.pend : 0;
  const guardado = sum(aportes,d=>d.valor) - sum(resgates,d=>d.valor);
  // receitas previstas: cada receita fixa conta pelo recebido, senão pelo esperado
  let previstoRec = 0;
  for (const r of S.cfg.receitas||[]){ const got = L.find(d=>d.rec===r.id); previstoRec += got ? 0 : (+r.valor||0); }
  const receitaPrev = entrou + previstoRec;
  const porCat = {}; for (const g of gastos){ const k = g.cat || "__sem"; porCat[k] = (porCat[k]||0) + g.valor; }
  const dz = S.cfg.dizimo?.ativo ? r2(receitaPrev * (+S.cfg.dizimo.pct||0)/100) : 0;
  const itens = itensDoMes(m);
  const prevCat = {}; for (const f of itens) prevCat[f.cat] = (prevCat[f.cat]||0) + previsto(f, m);
  const orc = id => id==="dizimo" ? dz : Math.max(+catById(id)?.orc||0, prevCat[id]||0);
  // itens "envelope" (Saídas, Gasolina, Dia a dia…): não se marcam como pagos; o que você gasta na categoria vai consumindo o previsto
  const porCatLivre = {}; for (const g of gastos) if (!g.fixo){ const k = g.cat || "__sem"; porCatLivre[k] = (porCatLivre[k]||0) + g.valor; }
  const fixosStatus = itens.map(f => { if (f.env){ const prev = previsto(f, m), gasto = r2(porCatLivre[f.cat]||0); return {f, env:true, gasto, pago:false, lanc:null, prev, resta: Math.max(0, prev - gasto)}; }
    const l = L.find(d=>d.fixo===f.id); return {f, pago:!!l, lanc:l, prev: previsto(f, m)}; });
  const fixosPend = sum(fixosStatus.filter(x=>!x.pago), x=>x.env ? x.resta : x.prev);
  let comprometido = 0;
  for (const c of S.cfg.cats) comprometido += Math.max(orc(c.id), porCat[c.id]||0);
  comprometido += (porCat.__sem||0);
  for (const k in porCat) if (k!=="__sem" && !catById(k)) comprometido += porCat[k];
  if (MF) comprometido += Math.max(CM.devido, CM.pagoMes);
  const gOv = S.cfg.planos?.[m]?.__guardar;
  const metaMensal = gOv!=null ? +gOv||0 : sum(S.cfg.metas||[], x=>+x.aporteMensal||0);
  const aporteComp = Math.max(metaMensal, guardado);
  const sobraPrev = receitaPrev - comprometido - aporteComp + sum(L.filter(d=>d.tipo==="ajuste"), d=>+d.valor||0);
  // ajuste manual: diferença entre o que o app calcula e o que a pessoa diz ter de verdade
  const ajuste = sum(L.filter(d=>d.tipo==="ajuste"), d=>+d.valor||0);
  const livre = entrou - saiu - guardado + ajuste;
  const atual = mesDe(hoje()), dia = new Date().getDate(), dim = diasNoMes(m);
  const restantes = m===atual ? dim - dia + 1 : (m>atual ? dim : 0);
  const dzPend = Math.max(0, dz - (porCat.dizimo||0));
  const guardarPend = Math.max(0, metaMensal - guardado);
  const caixaLivre = receitaPrev - saiu - fixosPend - cartPend - guardarPend - dzPend + ajuste;
  // planejamento do início do mês: recebo − fatura − contas − planejados − guardar = sobra para o dia a dia
  const contasPrev = sum(itens, f=>previsto(f, m));
  const cartPrev = MF ? Math.max(CM.devido, CM.pagoMes) : 0;
  const planSobra = receitaPrev - cartPrev - contasPrev - metaMensal - dz + ajuste;
  const porDia = restantes>0 ? Math.max(0, caixaLivre)/restantes : 0;
  const decorrido = m===atual ? dia/dim : (m<atual ? 1 : 0);
  return {L, gastos, receitas, aportes, entrou, saiu, guardado, receitaPrev, porCat, orc, dz, fixosStatus, fixosPend,
          comprometido, metaMensal, sobraPrev: MF ? planSobra : sobraPrev, livre, restantes, porDia, decorrido, caixaLivre, ajuste, guardarPend, dzPend, CM, cartPend, saiuCartao, contasPrev, cartPrev, planSobra};
}

function avisos(m, R){
  const out = [];
  const atual = mesDe(hoje()); const dia = new Date().getDate();
  const revisar = R.L.filter(d=>d.revisar && d.tipo==="gasto");
  if (revisar.length) out.push({nivel:"warn", txt:`${revisar.length} ${revisar.length>1?"lançamentos":"lançamento"} sem categoria`, sub:"Um toque em cada e o app aprende para a próxima.", btn:"Revisar", act:"revisar"});
  if (m===atual) for (const x of R.fixosStatus){ if (!x.pago && !x.env && +x.f.dia && +x.f.dia < dia) out.push({nivel:"crit", txt:`${x.f.nome} venceu dia ${x.f.dia}`, sub:`${fm(x.f.valor)} ainda sem lançamento.`, btn:"Paguei", act:"pagarFixo:"+x.f.id}); }
  for (const c of S.cfg.cats){
    const o = R.orc(c.id), g = R.porCat[c.id]||0;
    if (o<=0 && g<=0) continue;
    if (o>0 && g>o) out.push({nivel:"crit", txt:`${c.nome} passou ${fm0(g-o)} do previsto`, sub:`${fm0(g)} de ${fm0(o)}.`, btn:"Ver", act:"cat:"+c.id});
    else if (o>0 && m===atual && R.decorrido>0.2 && g/o > R.decorrido*1.25 && g/R.decorrido > o*1.1 && c.id!=="dizimo" && !(S.cfg.fixos||[]).some(f=>f.cat===c.id)){
      out.push({nivel:"warn", txt:`No ritmo atual, ${c.nome} fecha em ${fm0(g/R.decorrido)}`, sub:`Previsto: ${fm0(o)}. Já foi ${Math.round(g/o*100)}% com ${Math.round(R.decorrido*100)}% do mês.`, btn:"Ver", act:"cat:"+c.id});
    }
  }
  // duplicados
  const gs = R.gastos.slice().sort((a,b)=>a.data<b.data?-1:1);
  const vistos = new Set();
  for (let i=0;i<gs.length;i++) for (let j=i+1;j<gs.length;j++){
    const a=gs[i], b=gs[j];
    if (a.grupo && a.grupo===b.grupo) continue;
    if (Math.abs(a.valor-b.valor)<0.005 && keyOf(a.desc)===keyOf(b.desc) && Math.abs(new Date(a.data)-new Date(b.data))<=2*864e5){
      const k = a.id+b.id; if (vistos.has(k)) continue; vistos.add(k);
      out.push({nivel:"warn", txt:`Possível cobrança repetida: ${a.desc}`, sub:`${fm(a.valor)} em ${a.data.slice(8)}/${a.data.slice(5,7)} e ${b.data.slice(8)}/${b.data.slice(5,7)}.`, btn:"Ver", act:"busca:"+a.desc});
    }
  }
  // recorrência nova
  if (m===atual || m===addMes(atual,-1)){
    const fixKeys = new Set((S.cfg.fixos||[]).map(f=>keyOf(f.nome)));
    const dispensados = S.cfg.pulados||{};
    const seen = {};
    for (const back of [1,2,3]){ for (const d of lancDoMes(addMes(m,-back)).filter(d=>d.tipo==="gasto" && !d.grupo && !d.fixo)){ const k=keyOf(d.desc); if(!k) continue; (seen[k] ||= []).push(d); } }
    for (const d of R.gastos){
      const k = keyOf(d.desc); if (!k || d.fixo || d.grupo || fixKeys.has(k) || dispensados["rec:"+k]) continue;
      const prev = seen[k]||[]; const meses = new Set(prev.map(p=>p.mes));
      if (meses.size>=2 && prev.every(p=>Math.abs(p.valor-d.valor) <= Math.max(3, d.valor*0.2))){
        out.push({nivel:"info", txt:`${d.desc} aparece todo mês`, sub:`${fm(d.valor)} · ${meses.size+1} meses seguidos. Transformar em conta fixa?`, btn:"Virar fixa", act:"virarFixa:"+d.id});
        fixKeys.add(k);
      }
    }
  }
  if (m>=atual && R.receitaPrev<=0) out.push({nivel:"info", txt:"Cadastre seus salários", sub:"Com eles o app calcula a sobra do mês, o dízimo e quanto dá pra gastar por dia.", btn:"Cadastrar", act:"go:ajustes"});
  else if (m>=atual && R.sobraPrev < 0) out.push({nivel:"crit", txt:`O mês fecha ${fm0(-R.sobraPrev)} no vermelho`, sub: modoFatura() ? "Somando fatura, contas, orçamentos do dia a dia, planejados e o que vai guardar." : "Somando o previsto de todas as categorias, contas fixas e a meta de guardar.", btn: modoFatura() ? "Planejar" : "Orçamento", act: modoFatura() ? "planejar:"+m : "go:ajustes"});
  if (m<atual && R.L.length){
    const sobra = R.entrou - R.saiu - R.guardado;
    if (sobra>1 && (S.cfg.metas||[]).length) out.push({nivel:"good", txt:`${mesCurto(m)} fechou com ${fm0(sobra)} sobrando`, sub:`Mandar para ${S.cfg.metas[0].nome}?`, btn:"Guardar", act:"guardarSobra:"+r2(sobra)});
  }
  if (m===atual && dia>=20) for (const mt of S.cfg.metas||[]){
    const g = sum(R.aportes.filter(a=>(a.meta||S.cfg.metas[0].id)===mt.id), a=>a.valor);
    if (+mt.aporteMensal && g < +mt.aporteMensal) out.push({nivel:"info", txt:`Faltam ${fm0(mt.aporteMensal-g)} para a meta de ${mt.nome} este mês`, sub:"Um toque lança o que falta.", btn:"Guardar", act:"aportar:"+mt.id+":"+r2(mt.aporteMensal-g)});
  }
  if (m===atual){ const nx = faturaInfo(addMes(m,1)); const v = nx.porMes[m]||0;
    if (v>0) out.push({nivel:"info", txt:`${fm0(v)} da próxima fatura são gastos deste mês`, sub:"Comida e dia a dia no cartão já contam agora. Deixe esse valor separado para quando a fatura vencer.", btn:"Ver", act:"cartaoExtrato"}); }
  const ordem = {crit:0,warn:1,info:2,good:3};
  return out.sort((a,b)=>ordem[a.nivel]-ordem[b.nivel]);
}

/* ---------- metas ---------- */
function saldoMeta(mt){
  let s = +mt.saldoBase||0;
  for (const d of S.lanc.values()){
    if (d.tipo!=="aporte" && d.tipo!=="resgate") continue;
    const alvo = d.meta || (S.cfg.metas[0]||{}).id;
    if (alvo!==mt.id || (mt.dataBase && d.data < mt.dataBase)) continue;
    s += d.tipo==="aporte" ? d.valor : -d.valor;
  }
  return r2(s);
}
function historicoMeta(mt){
  const rows = (mt.historico||[]).map(h=>({data:h.data, valor:+h.valor, origem:h.origem||""}));
  for (const d of S.lanc.values()){
    if (d.tipo!=="aporte" && d.tipo!=="resgate") continue;
    if ((d.meta || (S.cfg.metas[0]||{}).id)!==mt.id) continue;
    rows.push({data:d.data, valor: d.tipo==="aporte"?d.valor:-d.valor, origem:d.desc});
  }
  return rows.sort((a,b)=>a.data<b.data?1:-1);
}

/* ---------- série histórica ---------- */
function serie(){
  const meses = new Set(Object.keys(S.hist));
  for (const d of S.lanc.values()) meses.add(d.mes);
  const atual = mesDe(hoje());
  const lista = [...meses].filter(m=>m<=atual).sort();
  return lista.map(m=>{
    const L = lancDoMes(m);
    if (L.length){ const R = resumo(m); return {m, entrou:R.entrou, saiu:R.saiu, guardado:Math.max(0,R.guardado), fonte:"app"}; }
    const h = S.hist[m]; return {m, entrou:+h.ganhos||0, saiu:Math.max(0,(+h.gastos||0)-(+h.guardado||0)), guardado:+h.guardado||0, fonte:"planilha"};
  });
}

const VERSAO = "12/10 17:40";

function render(){

function renderInterno(){
  document.body.classList.toggle("deslogado", !S.db);
  if (!S.db){ renderTabs(); $("#view").innerHTML = viewEntrada(); return; }
  renderTabs();
  const v = $("#view");
  const scroll = window.scrollY;
  const ae = document.activeElement; let fk=null, sel=null;
  if (ae && v.contains(ae)){ fk = ae.dataset?.cfg ? `[data-cfg="${ae.dataset.cfg}"]` : (ae.id ? "#"+ae.id : null); try{ sel = [ae.selectionStart, ae.selectionEnd]; }catch(e){} }
  if (S.view==="mes") v.innerHTML = viewMes();
  else if (S.view==="extrato") v.innerHTML = viewExtrato();
  else if (S.view==="metas") v.innerHTML = viewMetas();
  else if (S.view==="historico") v.innerHTML = viewHistorico();
  else if (S.view==="ajustes") v.innerHTML = viewAjustes();
  window.scrollTo(0, scroll);
  if (fk){ const n = v.querySelector(fk); if (n){ n.focus({preventScroll:true}); if (sel && sel[0]!=null){ try{ n.setSelectionRange(sel[0], sel[1]); }catch(e){} } } }
  const sy = $("#sync");
  sy.className = "sync " + (S.db ? "ok" : (S.online===null ? "" : "off"));
  sy.querySelector("span").textContent = S.visitante ? "neste navegador" : S.db ? "salvo" : (S.online===null ? "conectando" : "só neste aparelho");
}

  const fixPanel = `<section class="panel prevpanel"><div class="panel-h"><h2 style="--hc:var(--tang)">Previsto do mês</h2><button class="act" data-act="planejar:${m}">Planejar ${MES[+m.slice(5)-1]}</button></div>

function blocoPlano(m, R){

function viewExtrato(){
  const E = S.ext;
  let L = E.todos ? [...S.lanc.entries()].map(([id,d])=>Object.assign({id},d)) : lancDoMes(S.mes);
  if (E.tipo==="gasto") L = L.filter(d=>d.tipo==="gasto");
  if (E.tipo==="receita") L = L.filter(d=>d.tipo==="receita");
  if (E.tipo==="guardado") L = L.filter(d=>d.tipo==="aporte"||d.tipo==="resgate");
  if (E.tipo==="revisar") L = L.filter(d=>d.revisar);
  if (E.tipo==="cartao") L = L.filter(d=>d.cartao || d.tipo==="pagfatura");
  if (E.cat) L = L.filter(d=>d.cat===E.cat);
  if (E.busca){ const b = norm(E.busca); L = L.filter(d=>norm(d.desc).includes(b) || norm(catNome(d.cat)).includes(b) || String(d.valor).includes(b)); }
  L.sort((a,b)=> a.data===b.data ? (b.criado||0)-(a.criado||0) : (a.data<b.data?1:-1));
  const tot = sum(L.filter(d=>d.tipo==="gasto"),d=>d.valor), totIn = sum(L.filter(d=>d.tipo==="receita"),d=>d.valor);
  // compras do cartão viram subitens de "Fatura do cartão" (uma linha por fatura), para não lotar o extrato
  const agrupar = E.tipo!=="cartao" && !E.busca && !E.cat && E.tipo!=="revisar" && !E.soltar;
  const grupos = {};
  if (agrupar){
    const fora = [];
    for (const d of L){ if (d.cartao && d.tipo==="gasto" && d.fatura){ (grupos[d.fatura] ||= {itens:[], pag:null}).itens.push(d); } else fora.push(d); }
    for (const d of fora) if (d.tipo==="pagfatura" && d.fatura && grupos[d.fatura] && !grupos[d.fatura].pag) grupos[d.fatura].pag = d;
    L = fora.filter(d => !(d.tipo==="pagfatura" && grupos[d.fatura]?.pag===d));
    for (const [venc,g] of Object.entries(grupos)){ const dia = g.pag ? g.pag.data : g.itens.map(x=>x.data).sort().pop();
      L.push({id:"fat:"+venc, _grupo:true, venc, g, data:dia, tipo:"grupo", valor: sum(g.itens, x=>x.valor), criado: 0}); }
    L.sort((a,b)=> a.data===b.data ? (b.criado||0)-(a.criado||0) : (a.data<b.data?1:-1));
  }
  const byDay = {}; for (const d of L) (byDay[d.data] ||= []).push(d);

  const catOpts = `<option value="">Todas as categorias</option>`+S.cfg.cats.map(c=>`<option value="${c.id}" ${E.cat===c.id?"selected":""}>${esc(c.nome)}</option>`).join("");
  return `<div class="panel">
    <div class="filters">
      <input class="search" id="busca" type="search" placeholder="Buscar (posto, ifood, 52,90…)" value="${esc(E.busca)}">
      <select class="sel" id="fCat" aria-label="Categoria">${catOpts}</select>
      <button class="chip" id="fTodos" aria-pressed="${E.todos}">${E.todos?"Todos os meses":mesCurto(S.mes)}</button>
    </div>
    <div class="filters">${chip("todos","Tudo")}${chip("gasto","Gastos")}${chip("receita","Receitas")}${chip("guardado","Guardado")}${chip("cartao","Cartão")}${chip("revisar","Para revisar")}</div>
    <div class="tot-line"><span>${L.length} ${L.length===1?"lançamento":"lançamentos"}</span><span class="num">saídas ${fm(tot)} · entradas ${fm(totIn)}</span></div>
    ${L.length ? Object.keys(byDay).map(day=>`<div class="day"><div class="day-h"><span>${esc(diaSemana(day))}</span><span class="num">${fm(sum(byDay[day].filter(d=>d.tipo==="gasto"||d.tipo==="grupo"),d=>d.valor))}</span></div>
      ${byDay[day].map(d=>{ if (d._grupo) return grupoFatura(d);
        const cls = d.tipo==="receita"?"in":(d.tipo==="aporte"||d.tipo==="resgate")?"sv":""; const sinal = d.tipo==="ajuste" ? (d.valor>=0?"+":"−") : d.tipo==="receita"?"+":(d.tipo==="gasto"?"−":(d.tipo==="aporte"?"→":d.tipo==="pagfatura"?"✓":"←"));
        const lab = d.tipo==="ajuste" ? "Ajuste manual de saldo (toque para tirar)" : d.tipo==="pagfatura" ? `Pagamento da fatura de ${mesAb(d.fatura)} (não entra no orçamento)` : d.tipo==="gasto" ? catNome(d.cat) : d.tipo==="receita" ? "Receita" : d.tipo==="aporte" ? "Guardado em "+((S.cfg.metas.find(x=>x.id===d.meta)||S.cfg.metas[0]||{}).nome||"meta") : "Resgate";
        return `<button class="tx" ${d.tipo==="ajuste"?`data-act="limparAjuste:${d.mes}"`:`data-edit="${d.id}"`}><span class="d">${esc(d.desc)}</span><span class="val num ${cls}">${sinal} ${fm(Math.abs(d.valor))}</span>
          <span class="m">${d.tipo==="gasto"?`<span class="dot" style="--cc:${corCat(d.cat)}"></span>`:""}${esc(lab)}${d.parc?` · parcela ${d.parc}`:""}${d.fixo?" · fixa":""}${d.cartao?` · cartão, fatura de ${mesAb(d.fatura)}${d.pagoEm?(d.aPagar?` · adiantar em ${mesAb(d.pagoEm)}`:` · paga antes, em ${mesAb(d.pagoEm)}`):d.mes!==mesDe(d.data)?` (conta em ${mesAb(d.mes)})`:""}`:""}${d.revisar?` <span class="flag">· revisar</span>`:""}</span>${d.divide?`<span class="m"><span class="pill ${d.divide.recebido?"g":"y"}" style="font-size:11.5px">${esc(d.divide.quem)} ${d.divide.recebido?"pagou":"vai pagar"} ${fm(d.divide.valor)} · total ${fm(d.valorTotal)}</span></span>`:""}${d.nota?`<span class="m nota">“${esc(d.nota)}”</span>`:""}</button>`; }).join("")}</div>`).join("")
      : `<div class="empty"><b>Nada por aqui</b>${E.busca||E.cat||E.tipo!=="todos"?"Nenhum lançamento com esses filtros.":"Lance o primeiro gasto na barra lá em cima: “50 gasolina”."}</div>`}
  </div>`;
}

function barras(data){
  const W = Math.max(560, data.length*22), H = 220, pl = 46, pr = 8, pt = 10, pb = 26;
  const mx = Math.max(1, ...data.map(d=>Math.max(d.entrou, d.saiu+d.guardado)));
  const step = niceStep(mx/4); const top = Math.ceil(mx/step)*step;
  const y = v => pt + (H-pt-pb)*(1 - v/top);
  const bw = (W-pl-pr)/data.length;
  let g = "";
  for (let v=0; v<=top+0.1; v+=step){ g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v>=1000?(v/1000).toLocaleString("pt-BR")+"k":v}</text>`; }
  data.forEach((d,i)=>{
    const x = pl + i*bw, w = Math.max(3, bw*0.36);
    g += `<rect x="${(x+bw*0.12).toFixed(1)}" y="${y(d.entrou).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(0)-y(d.entrou)).toFixed(1)}" fill="var(--blue)" rx="2"><title>${mesCurto(d.m)} · entrou ${fm0(d.entrou)}</title></rect>`;
    const x2 = x+bw*0.12+w+1;
    g += `<rect x="${x2.toFixed(1)}" y="${y(d.saiu).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(0)-y(d.saiu)).toFixed(1)}" fill="var(--tang)" rx="2"><title>${mesCurto(d.m)} · saiu ${fm0(d.saiu)}</title></rect>`;
    if (d.guardado>0) g += `<rect x="${x2.toFixed(1)}" y="${y(d.saiu+d.guardado).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(d.saiu)-y(d.saiu+d.guardado)).toFixed(1)}" fill="var(--gold)"><title>${mesCurto(d.m)} · guardado ${fm0(d.guardado)}</title></rect>`;
    const every = Math.ceil(data.length/14);
    if (i%every===0) g += `<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${mesAb(d.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">${g}</svg>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const n = x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

function acharDuplicado(r){
  if (r.tipo!=="gasto" && r.tipo!=="pagfatura") return null;
  const h = hashL(r), t = new Date(r.data+"T12:00:00").getTime();
  for (const [id,d] of S.lanc){
    if (d.tipo!==r.tipo) continue;
    if (d.h===h) return id;
    if (Math.abs(totalDe(d) - (+r.valor||0)) > 0.01) continue;
    const dt = Math.abs(new Date(d.data+"T12:00:00").getTime() - t) / 864e5;
    if (dt <= 3) return id;
  }
  return null;
}
const TIPO_COTIDIANO = c => ["mercado","delivery","saidas"].includes(c) ? "comida" : c==="transporte" ? "gasolina e transporte" : ["diaadia","pet","saude","cuidados","futebol"].includes(c) ? "dia a dia" : null;
const mesAtual = () => mesDe(hoje());
/* fatura do mês que vem com compras deste mês: "Pagar este mês" (você acerta agora, pesa neste mês e sai do que fica para a fatura) */
const ehDeFaturaFutura = r => mesDe(r.data) >= mesAtual() && (r.fatura||"") > mesAtual();
const rotPago = r => ehDeFaturaFutura(r) ? "Pagar este mês" : "Já paguei";
function mesPago(r){ if (r.pagoMes) return r.pagoMes; const mc = mesDe(r.data), at = mesAtual(); return mc < at ? mc : at; }
const ehAPagar = r => !!(r.cartao && r.tipo==="gasto" && r.pago && !r._jaPago && !r.pagoMes && ehDeFaturaFutura(r));
function candidatosPagos(rows){
  const atual = mesAtual();
  return rows.filter(r => r.cartao && r.tipo==="gasto" && r._on && TIPO_COTIDIANO(r.cat) && mesDe(r.data) <= atual && mesDe(r.data) < (r.fatura||atual));
}
function sugerirPagos(rows, alvo){
  rows.forEach(r => { if (r._sug){ r.pago = false; r._sug = false; r._jaPago = false; } });
  const cand = candidatosPagos(rows).filter(r => !r.pago).sort((a,b)=>a.data<b.data?-1:1);
  const passados = cand.filter(r => !ehDeFaturaFutura(r)), atuais = cand.filter(ehDeFaturaFutura);
  const escolhidos = [];
  if (alvo > 0){ let soma = 0; for (const r of passados){ if (soma + (+r.valor||0) <= alvo + 0.01){ escolhidos.push(r); soma += +r.valor||0; } } }
  else escolhidos.push(...passados);
  escolhidos.concat(atuais).forEach(r => { r.pago = true; r._sug = true; });
  if (modoFatura()) rows.forEach(r => { if (r.cartao && r.tipo==="gasto" && r._on && !r.pago && !r.parcInfo && mesDe(r.data) < (r.fatura||"") && acharItemPrevisto(r.desc, mesDe(r.data), true)){ r.pago = true; r._sug = true; r.pagoMes = mesDe(r.data); } });
  const por = {}, porA = {}; escolhidos.forEach(r => { const k = TIPO_COTIDIANO(r.cat); por[k] = (por[k]||0) + (+r.valor||0); });
  atuais.forEach(r => { const k = TIPO_COTIDIANO(r.cat); porA[k] = (porA[k]||0) + (+r.valor||0); });
  memo.set("sugPago", {n: escolhidos.length, total: sum(escolhidos, r=>+r.valor||0), por, nA: atuais.length, totalA: sum(atuais, r=>+r.valor||0), porA});
  return escolhidos.length + atuais.length;
}
async function categorizarLoteIA(){
  const rows = memo.get("lote")||[]; if (!S.ai || memo.get("catIA")) return;
  const alvo = rows.map((r,i)=>({i, r})).filter(({r}) => r.tipo==="gasto" && !r.cat && r.desc); if (!alvo.length) return;
  memo.set("catIA", true);
  const prompt = `Classifique cada compra brasileira (cartão, Pix ou extrato) numa destas categorias. Use só o id:
${S.cfg.cats.map(c=>`${c.id}: ${c.nome}`).join("\n")}

Os nomes vêm da maquininha ou do banco, com prefixos como PG *, MP *, EC *, PAG*, SUMUP *, IFD*: ignore o prefixo e pense no estabelecimento. Supermercado, atacado, açougue e hortifruti são mercado; restaurante, lanchonete, bar, sorveteria e café são saídas; app de comida é delivery; posto, Uber e estacionamento são transporte; farmácia, clínica e academia são saúde. Se for nome de pessoa ou impossível saber, use "outros".

Compras (índice|descrição|valor):
${alvo.map(({i,r})=>`${i}|${r.desc}|${(+r.valor||0).toFixed(2)}`).join("\n")}

Responda só com JSON: [{"i": índice, "cat": "id"}]`;
  try{
    const res = await S.ai.json(prompt, null, {modelTier:"quick"}); const arr = Array.isArray(res) ? res : (res.itens||res.compras||res.resultado||[]);
    let n = 0; for (const x of arr){ const r = rows[+x.i]; if (r && !r.cat && x.cat && x.cat!=="outros" && catById(x.cat)){ r.cat = x.cat; r._catIA = true; n++; } }
    if (!n || memo.get("lote")!==rows || !$("#loteBtn")) return;
    if (!memo.get("loteMexeu") && rows.some(r=>r.cartao)) sugerirPagos(rows, memo.get("loteAlvoValor")||0);
    if (!document.querySelector(".lc-edit:not([hidden])")) folhaLote(rows, memo.get("loteTitulo"), memo.get("loteNota"), memo.get("loteVenc"), true);
    toast(`A IA pôs categoria em ${n} ${n>1?"compras":"compra"} que eu não reconheci. Elas têm a marca ✦.`, null, 5000);
  }catch(e){ memo.delete("catIA"); }
}
function estadoLinha(r){ return r._dupId && !r._on ? "existe" : !r._on ? "fora" : (r.cartao && r.tipo==="gasto" && r.pago) ? "pago" : "lancar"; }
function folhaLote(rows, titulo, nota, venc, manter){
  if (!manter){

  abrirFolha(`<h3>${esc(titulo)}</h3><p class="lead">${esc(nota||"Para cada compra, escolha: Lançar, Já paguei ou Não lançar. Toque na compra para editar.")}</p>

        <label>Fatura do cartão que vence em <select id="loteVenc">${opcoesVenc.map(m=>`<option value="${m}" ${m===venc?"selected":""}>${mesLongo(m)}</option>`).join("")}</select></label>
        ${(()=>{ const sp = memo.get("sugPago"); const tot = {}; rows.filter(r=>r.cartao && r.tipo==="gasto" && (r._on||r._dupId)).forEach(r=>{ const k = TIPO_COTIDIANO(r.cat) || "outras compras"; tot[k]=(tot[k]||0)+(+r.valor||0); });
          return `<div class="fb-cot"><b>O que tem nesta fatura</b><div>${Object.entries(tot).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="pill">${esc(k)} ${fm0(v)}</span>`).join(" ")}</div>
          ${venc > mesAtual() ? `<div class="sugbox futura"><b>Esta fatura só vence em ${mesLongo(venc)}</b><span>Comida, gasolina e dia a dia de ${mesLongo(mesAtual())} que vieram nela ficam como <b>“Pagar este mês”</b>: você acerta agora, junto com as contas de ${MES[+mesAtual().slice(5)-1]}, e elas saem do que fica para ${MES[+venc.slice(5)-1]}. Parcelas e compras maiores continuam na fatura.</span>${sp && sp.nA ? `<span>Marquei ${sp.nA} ${sp.nA>1?"compras":"compra"}: <b>${fm(sp.totalA)}</b> (${Object.entries(sp.porA).map(([k,v])=>`${k} ${fm0(v)}`).join(", ")}).</span>` : ""}</div>` : ""}
          ${sp && sp.n ? `<div class="sugbox"><b>Sugestão: marquei ${sp.n} ${sp.n>1?"compras":"compra"} como “Já paguei” (${fm(sp.total)})</b><span>São compras do dia a dia de meses anteriores: ${Object.entries(sp.por).map(([k,v])=>`${k} ${fm0(v)}`).join(", ")}. Revise as marcadas com <i>sugestão</i>.</span></div>` : ""}
          <div class="btns" style="margin:6px 0 0">${sp && (sp.n || sp.nA) ? `<button type="button" class="btn" data-act="desfazerSug">Desfazer sugestões</button>` : `<button type="button" class="btn" data-act="refazerSug">Sugerir o que já foi pago ou é deste mês</button>`}</div></div>`; })()}
        <div class="fb-pago"><b>Já adiantou parte desta fatura?</b>

function alvoLote(){
  const el = $("#loteAlvo"); if (!el) return; const rows = memo.get("lote")||[];
  const txt = $("#loteFalta")?.value||""; const falta = parseValor(txt);
  const total = sum(rows.filter(r=>r.cartao && r.tipo==="gasto" && (r._on || r._dupId)), r=>+r.valor||0);
  const pagosLinhas = sum(rows.filter(r=>r.cartao && r.tipo==="gasto" && r._on && r.pago && !ehAPagar(r)), r=>+r.valor||0);
  const pagfat = sum(rows.filter(r=>r.tipo==="pagfatura" && (r._on || r._dupId)), r=>+r.valor||0);
  if (!txt){ el.innerHTML = `Total das compras: <b>${fm(total)}</b>. Se o banco cobra menos que isso, a diferença é o que você já pagou.`; $("#loteAutoBtn").hidden = true; return; }
  const alvo = r2(total - pagfat - falta), dif = r2(pagosLinhas - alvo);
  memo.set("loteAlvoValor", alvo);
  el.innerHTML = alvo <= 0.5 ? `Pelo banco, nada foi adiantado${pagfat?` além dos ${fm(pagfat)} de pagamento que já vieram na fatura`:""}.` :
    `Compras ${fm(total)} − falta ${fm(falta)}${pagfat?` − pagamentos ${fm(pagfat)}`:""} = <b>${fm(alvo)} já pagos</b>. Marcados como “Já paguei”: ${fm(pagosLinhas)}. ${Math.abs(dif)<0.5?"<b style='color:var(--mint)'>Bateu.</b>":dif<0?`Faltam ${fm(-dif)}.`:`Passou ${fm(dif)}.`}`;
  $("#loteAutoBtn").hidden = !(alvo > 0.5);
}
function rotuloLote(){ const rows = memo.get("lote")||[]; const n = rows.filter(r=>r._on && r.tipo!=="interno").length, v = rows.filter(r=>!r._on && r._dupId).length; return `Lançar ${n}${v?` · ligar ${v}`:""}`; }

  const cats = Object.entries(porCat).sort((a,b)=>b[1]-a[1]); const mxC = cats[0]?.[1]||1;

  for (const [k,v] of cats){ const c = catById(k); if (!c || !(+c.orc)) continue; const m = Object.keys(porConta)[0]; if (v > +c.orc) dicas.push({t:`${c.nome} passou do orçamento`, d:`Só nesta fatura foram ${fm0(v)}, para um previsto de ${fm0(c.orc)} no mês.`}); }
  memo.set("analise", {itens, venc, stats:{total, minha, receber, pago, porConta, cats, comidaT, delivT, delivN:deliv.length, mercT, saidT, sems:sems.map(k=>[k,porSem[k]]), topLojas, pequenosT, pequenosN:pequenos.length, assinT}, doLote});
  const listaItens = L => `<div class="an-itens">${L.slice().sort((a,b)=>a.data<b.data?-1:1).map(x=>`<div class="an-item"><span class="dt">${x.data.slice(8)}/${x.data.slice(5,7)}</span><span class="ds">${esc(x.desc)}${x.parcInfo?` <small>parcela ${esc(x.parcInfo)}</small>`:""}${x.nota?` <small>“${esc(x.nota)}”</small>`:""}${x.divide?` <small>${esc(x.divide.quem||"alguém")} paga ${fm0(x.divide.valor)}</small>`:""}</span><b>${fm(x.minha)}</b></div>`).join("")}</div>`;

    return L && L.length ? `<details class="an-det"><summary>${b}</summary>${listaItens(L)}</details>` : b; };

    <div class="an-kpis">
      <div><dt>Total</dt><dd>${fm0(total)}</dd></div>
      <div><dt>Sua parte</dt><dd>${fm0(minha)}</dd>${receber>0.5?`<small>${fm0(receber)} a receber</small>`:""}</div>

function contextoFatura(A){
  const G = A.itens.filter(x=>x.tipo==="gasto");
  const dias = ["dom","seg","ter","qua","qui","sex","sáb"];
  const porDia = {}; G.forEach(x=>{ const d = dias[new Date(x.data+"T12:00:00").getDay()]; porDia[d]=(porDia[d]||0)+x.minha; });
  // média dos 3 meses anteriores por categoria (dados do app)
  const ref = A.venc || mesDe(hoje()); const ant = [1,2,3].map(k=>addMes(ref,-k));
  const media = {}; ant.forEach(mm => lancDoMes(mm).filter(d=>d.tipo==="gasto").forEach(d=>{ const k = catNome(d.cat); media[k]=(media[k]||0)+d.valor/3; }));
  const R = resumo(mesDe(hoje()));
  const metas = (S.cfg.metas||[]).map(m=>`${m.nome}: saldo ${saldoMeta(m).toFixed(0)}, alvo ${m.alvo}, guardando ${m.aporteMensal||0}/mês`).join("; ");
  // lista enxuta: as 250 maiores compras linha a linha; o resto vai somado por categoria
  const ord = G.slice().sort((a,b)=>b.minha-a.minha), top = ord.slice(0,250), resto = ord.slice(250);
  const restoCat = {}; resto.forEach(x=>{ const k = catNome(x.cat); restoCat[k]=(restoCat[k]||0)+x.minha; });
  const lista = top.sort((a,b)=>a.data<b.data?-1:1).map(x=>`${x.data.slice(8)}/${x.data.slice(5,7)} ${dias[new Date(x.data+"T12:00:00").getDay()]}|${String(x.desc).slice(0,38)}|${catNome(x.cat)}|${x.minha.toFixed(2)}${x.valor!==x.minha?` (total ${x.valor.toFixed(0)}, outro paga resto)`:""}${x.parcInfo?"|parc "+x.parcInfo:""}${x.nota?"|nota: "+String(x.nota).slice(0,60):""}`).join("\n").slice(0,24000)
    + (resto.length ? `\n+ ${resto.length} compras menores somadas: ${Object.entries(restoCat).map(([k,v])=>k+" "+v.toFixed(0)).join("; ")}` : "");
  return `FATURA ${A.venc?("que vence em "+A.venc):""}
Total ${A.stats.total.toFixed(2)} | parte da pessoa ${A.stats.minha.toFixed(2)} | a receber de outros ${A.stats.receber.toFixed(2)} | já pago/adiantado ${A.stats.pago.toFixed(2)}
Comida: total ${A.stats.comidaT.toFixed(2)} (mercado ${A.stats.mercT.toFixed(2)}, delivery ${A.stats.delivT.toFixed(2)} em ${A.stats.delivN} pedidos, saídas ${A.stats.saidT.toFixed(2)}) | assinaturas/jogos ${A.stats.assinT.toFixed(2)} | ${A.stats.pequenosN} compras de até R$30 somando ${A.stats.pequenosT.toFixed(2)}
Gasto por dia da semana: ${Object.entries(porDia).map(([d,v])=>d+" "+v.toFixed(0)).join(", ")}
Média mensal dos 3 meses anteriores por categoria (app): ${Object.entries(media).map(([k,v])=>k+" "+v.toFixed(0)).join("; ")||"sem dados"}
Orçamento mensal definido: ${S.cfg.cats.filter(c=>+c.orc).map(c=>c.nome+" "+c.orc).join("; ")||"não definido"}

COMPRAS (dd/mm dia|descrição|categoria|valor da parte da pessoa):
${lista}`;
}

/* ---------- importação ---------- */
function csvRows(text){
  const rows=[]; let row=[], cur="", q=false;
  const sep = (text.split("\n")[0].match(/;/g)||[]).length > (text.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if (c==='"') q=true; else if (c===sep){ row.push(cur); cur=""; } else if (c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } else if (c!=="\r") cur+=c; }
  if (cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
function dataBR(s){ s=String(s).trim(); let m; if ((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0]; if ((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) return (m[3].length===2?"20"+m[3]:m[3])+"-"+pad(m[2])+"-"+pad(m[1]); return null; }
function importarCSV(text){
  const rows = csvRows(text); if (rows.length<2) return null;
  const h = rows[0].map(x=>norm(x).trim());
  const out = [];
  if (h.includes("date") && h.includes("title") && h.includes("amount")){ // fatura Nubank
    const iD=h.indexOf("date"), iT=h.indexOf("title"), iA=h.indexOf("amount");
    for (const r of rows.slice(1)){ const v = parseFloat(r[iA]); const data = dataBR(r[iD]); if (!data||!isFinite(v)) continue;
      const desc = titulo(String(r[iT]).replace(/\*/g," ")).replace(/\s+-\s+Parcela.*$/i,"");
      if (/pagamento recebido|pagamento antecipado|pagamento efetuado/i.test(r[iT])) { out.push({data, desc:"Pagamento da fatura", valor:Math.abs(v), tipo:"pagfatura", cat:null}); continue; }
      const parc = String(r[iT]).match(/parcela\s*(\d+)\s*\/\s*(\d+)/i);
      out.push({data, desc, valor:Math.abs(v), tipo: v<0?"receita":"gasto", cat: v<0?"__rec":categorizar(desc), cartao: v>0, parcInfo: parc ? parc[1]+"/"+parc[2] : null}); }
    out._fatura = true;
    return out;
  }
  const iD = h.findIndex(x=>/^data|^date/.test(x)), iV = h.findIndex(x=>/valor|amount|quantia/.test(x)), iS = h.findIndex(x=>/descri|historico|title|lancamento|estabelec/.test(x));
  if (iD<0||iV<0) return null;
  for (const r of rows.slice(1)){
    const data = dataBR(r[iD]); const v = parseValor(String(r[iV]).replace(/\s/g,"").replace(/^(-?)R\$/,"$1")); if (!data || !isFinite(v) || v===0) continue;
    let raw = String(r[iS]??"");
    let desc = raw.replace(/^(compra no debito|compra no débito|transferencia enviada pelo pix|transferência enviada pelo pix|transferencia recebida pelo pix|transferência recebida pelo pix|transferencia recebida|transferência recebida|pagamento de boleto efetuado|debito em conta|débito em conta)\s*-\s*/i,"").split(" - ")[0];
    desc = titulo(desc.replace(/\*/g," ")).slice(0,60) || "Lançamento";
    let tipo = v<0 ? "gasto" : "receita";
    const n = norm(raw);
    if (/pagamento de fatura/.test(n)) { tipo = "pagfatura"; desc = "Pagamento da fatura"; }
    else if (/aplicacao rdb|resgate rdb|caixinha|transferencia entre contas|guardado|dinheiro guardado|dinheiro resgatado/.test(n)) tipo = "interno";
    if (/pix/.test(n) && tipo==="gasto") desc = "Pix · " + desc;
    out.push({data, desc, valor:Math.abs(v), tipo, cat: tipo==="gasto"?categorizar(desc):(tipo==="receita"?"__rec":null)});
  }
  return out;
}

function jsonSolto(t){ t = String(t||"").trim(); try{ return JSON.parse(t); }catch(e){} const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try{ return JSON.parse(f[1]); }catch(e){} } const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("]"), t.lastIndexOf("}")); if (a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} } const err = new Error("json"); err.code = "invalid_json"; throw err; }
function iaClaude(sample){ return {

  erro: e => ({not_granted:"Você não liberou o uso do Claude para este app.", rate_limited:"Muitas leituras seguidas. Espere um pouco.", images_unavailable:"Este aparelho não consegue enviar imagens. Cole o texto.", invalid_json:"A leitura veio confusa. Tente de novo."})[e?.code]

function iaGemini(){
  const MODELOS = ["gemini-3.8-flash","gemini-3-flash-preview","gemini-flash-latest","gemini-3.5-flash-lite"];
  let idx = 0; try{ const salvo = localStorage.getItem("caderneta-modelo"); if (salvo && MODELOS.includes(salvo)) idx = MODELOS.indexOf(salvo); }catch(e){}
  async function modelo(json){
    FB.aiM ||= await import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-ai.js`);
    FB.ai ||= FB.aiM.getAI(FB.app, {backend: new FB.aiM.GoogleAIBackend()});
    return FB.aiM.getGenerativeModel(FB.ai, {model: MODELOS[idx], generationConfig: json ? {responseMimeType:"application/json"} : {}});
  }
  async function tentar(json, fn){
    let ultimo = null;
    for (let tent = 0; tent < MODELOS.length; tent++){
      try{ const r = await fn(await modelo(json)); try{ localStorage.setItem("caderneta-modelo", MODELOS[idx]); }catch(e){} return r; }
      catch(e){ ultimo = e; const m = String(e?.message||e);
        if (e?.code==="invalid_json" || /quota|RESOURCE_EXHAUSTED|429|SERVICE_DISABLED|has not been used|API key/i.test(m)) throw e;
        if (idx < MODELOS.length-1){ idx++; continue; } throw e; } }
    throw ultimo;
  }
  const partes = imgs => Promise.all([...imgs].map(f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({inlineData:{data:String(r.result).split(",")[1], mimeType:f.type||"image/jpeg"}}); r.onerror = rej; r.readAsDataURL(f); })));
  return {
    json: (prompt, imgs, extra) => tentar(true, async m => { const conteudo = imgs ? [prompt, ...(await partes(imgs))] : prompt;
      // em streaming: a conexão não fica parada esperando a resposta inteira (no celular ela caía no meio)
      const r = await m.generateContentStream(conteudo); let t = ""; for await (const c of r.stream){ t += c.text(); extra?.parcial?.(t.length); } return jsonSolto(t); }),
    texto: (prompt, onText) => tentar(false, async m => { const r = await m.generateContentStream(prompt); let t = ""; for await (const c of r.stream){ t += c.text(); onText(t); } return t; }),
    erro: e => { const m = String(e?.message||e);
      if (e?.code==="invalid_json") return "A leitura veio confusa. Tente de novo.";
      if (/SERVICE_DISABLED|has not been used in project|is disabled/i.test(m)) return "A API de IA está desligada no projeto: Firebase → AI Logic → Gemini Developer API. Detalhe: " + m.replace(/https?:\/\/\S+/g,"").slice(0,160);
      if (/quota|429|RESOURCE_EXHAUSTED/i.test(m)) return "Limite gratuito da IA atingido por agora. Tente mais tarde.";
      if (/Failed to fetch|network|Load failed|NetworkError|aborted|timeout/i.test(m)) return "A conexão caiu no meio da resposta da IA (comum no 4G ou com a tela apagando). Toque em Tentar de novo com a tela acesa.";
      return "A IA respondeu com erro (modelo " + MODELOS[idx] + "): " + m.replace(/https?:\/\/\S+/g,"").replace(/\s+/g," ").slice(0,220); }
  };
}

  const P = parseTexto(v);
  const iaBtn = S.ai ? ` <button class="chip" data-act="iaLinha">Ler com IA</button>` : "";
  if (P.itens.length>1 || P.linhas.length>1){
    atualP = {lote:P.itens, falhas:P.falhas, texto:v, multi:P.linhas.length>1};
    $("#goBtn").disabled = !P.itens.length && !S.ai;
    const cor = {gasto:"",receita:"g",aporte:"y",resgate:"y",pagfatura:"y"};
    pv.innerHTML = P.itens.slice(0,8).map(p=>`<span class="pill ${cor[p.tipo]}">${p.tipo==="receita"?"+":p.tipo==="gasto"?"−":p.tipo==="aporte"?"→":"←"} ${fm(p.valor)} · ${esc(p.desc)}</span>`).join("")
      + (P.itens.length>8?`<span class="hint">+${P.itens.length-8}</span>`:"")
      + (P.falhas.length?`<span class="pill o">${P.falhas.length} trecho(s) sem valor</span>`:"") + iaBtn;
    return;
  }
  const p = P.itens[0] || null; atualP = p;
  $("#goBtn").disabled = !p && !S.ai;
  if (!p){ pv.innerHTML = `<span class="pill o">Faltou o valor</span><span class="hint">Ex.: “mercado 230”.</span>${iaBtn}`; return; }
  const tipoL = {gasto:["Gasto",""],receita:["Receita","g"],aporte:["Guardar","y"],resgate:["Resgate","y"],pagfatura:["Pagou a fatura","y"]}[p.tipo];
  const catSel = p.tipo==="gasto" ? `<span class="pill ${p.cat?"":"o"}"><span class="dot" style="--cc:${corCat(p.cat)}"></span><select id="pvCat" aria-label="Categoria">${p.cat?"":`<option value="">Sem categoria</option>`}${S.cfg.cats.map(c=>`<option value="${c.id}" ${p.cat===c.id?"selected":""}>${esc(c.nome)}</option>`).join("")}<option value="__nova">＋ Nova categoria…</option></select></span>` : "";
  const metaSel = (p.tipo==="aporte"||p.tipo==="resgate") && (S.cfg.metas||[]).length ? `<span class="pill y"><select id="pvMeta" aria-label="Meta">${S.cfg.metas.map(m=>`<option value="${m.id}" ${p.meta===m.id?"selected":""}>${esc(m.nome)}</option>`).join("")}</select></span>` : "";
  const d = p.data===hoje() ? "hoje" : p.data.slice(8)+"/"+p.data.slice(5,7);
  const ligado = p.tipo==="gasto" && (p.parcelas||1)===1 && !p.cartao ? acharItemPrevisto(p.desc, p.data.slice(0,7)) : null;
  pv.innerHTML = `${ligado?`<span class="pill" style="background:var(--tang-soft);color:var(--tang)">✓ ${esc(ligado.nome)} (previsto ${fm0(previsto(ligado, p.data.slice(0,7)))})</span>`:""}<span class="pill ${tipoL[1]}">${tipoL[0]}</span><span class="pill num">${p.parcelas>1?p.parcelas+"× "+fm(p.valor/p.parcelas):fm(p.valor)}</span>${catSel}${metaSel}<span class="pill">${esc(d)}</span><span class="hint">${esc(p.desc)}</span>`;
}
async function lancarDaBarra(){
  const texto = $("#q").value;
  if (!atualP){ if (S.ai && texto.trim()){ $("#q").value=""; atualizarPreview(); iaExtrair(texto); } return; }
  if (atualP.lote){
    const L = atualP.lote, falhas = atualP.falhas||[];
    if (!L.length){ if (S.ai){ $("#q").value=""; atualizarPreview(); iaExtrair(texto); } return; }
    if (atualP.multi || falhas.length || L.length>6){
      const rows = L.map(p=>({data:p.data, desc:p.desc, valor:p.valor, tipo:p.tipo, cat:p.cat, meta:p.meta, rec:p.rec, parcelas:p.parcelas}));
      folhaLote(rows, `${rows.length} lançamentos`, falhas.length ? `Não achei valor em: “${falhas.join("”, “")}”.${S.ai?" Se preferir, use Ler com IA.":""}` : null);
      return;
    }
    $("#q").value = ""; atualizarPreview();
    try{
      let ids = []; for (const p of L) ids = ids.concat(await lancarParsed(p));
      const tot = (t)=>sum(L.filter(p=>p.tipo===t),p=>p.valor);
      const partes = [tot("receita")?`+${fm(tot("receita"))}`:"", tot("gasto")?`−${fm(tot("gasto"))}`:"", tot("aporte")?`guardado ${fm(tot("aporte"))}`:""].filter(Boolean).join(" · ");
      toast(`${L.length} lançamentos: ${partes}`, async ()=>{ for (const id of ids) await apagarLanc(id); toast("Desfeito"); }, 6000);
    }catch(e){ toast("Não consegui salvar. Confira a conexão e tente de novo."); }
    return;
  }
  const p = Object.assign({}, atualP);
  const cs = $("#pvCat"); if (cs && p.tipo==="gasto") p.cat = cs.value || null;
  const ms = $("#pvMeta"); if (ms) p.meta = ms.value;
  if (p.tipo==="gasto" && p.cat && atualP.cat !== p.cat){ const k = keyOf(p.desc); if (k){ S.cfg.regras[k] = p.cat; salvarCfg(); } }
  $("#q").value = ""; atualizarPreview();
  const fl = p.tipo==="gasto" && !p.fixo && (p.parcelas||1)===1 && !p.cartao ? acharItemPrevisto(p.desc, mesDe(p.data)) : null;
  try{
    const ids = await lancarParsed(p);
    toast(fl ? `${fl.nome}: ${fm(p.valor)} marcado como pago no previsto` : `${p.tipo==="receita"?"Receita":p.tipo==="aporte"?"Guardado":p.tipo==="pagfatura"?"Pagamento da fatura":"Gasto"} de ${fm(p.valor)} lançado${p.parcelas>1?" em "+p.parcelas+" parcelas":""}`, async ()=>{ for (const id of ids) await apagarLanc(id); toast("Desfeito"); });
  }catch(e){ toast("Não consegui salvar. Confira a conexão e tente de novo."); }
}

/* ---------- ações ---------- */
async function acao(a, el){
  const [cmd, ...rest] = a.split(":"); const arg = rest.join(":");
  const m = S.mes, R = () => resumo(m);
  switch(cmd){
    case "noop": return;
    case "editarCartao": memo.set("fxCart", arg); render(); setTimeout(()=>{ const i = $("#cartVal"); i?.focus(); i?.select(); },0); return;
    case "confirmaCartao": { const txt = ($("#cartVal")?.value||"").trim(); memo.delete("fxCart"); (S.cfg.planos ||= {}); (S.cfg.planos[arg] ||= {});
      if (!txt) delete S.cfg.planos[arg].__cartao; else S.cfg.planos[arg].__cartao = parseValor(txt)||0; salvarCfg(true); render(); return; }
    case "pagarCartao": { const CM = cartaoDoMes(arg); const v = CM.pend; if (!(v>0)){ memo.set("fxCart", arg); render(); setTimeout(()=>$("#cartVal")?.focus(),0); toast("Digite quanto veio a fatura."); return; }
      const id = uid(); await gravarLanc(id, {tipo:"pagfatura", valor:v, desc:"Fatura do cartão", fatura:arg, cat:null, data: arg===mesDe(hoje()) ? hoje() : dataNoMes(arg, (S.cfg.cartao||{}).vencimento||10), origem:"checklist", criado:Date.now()});
      toast(`Fatura de ${MES[+arg.slice(5)-1]}: ${fm(v)} paga`, async()=>{ await apagarLanc(id); toast("Desfeito"); }); return; }
    case "desfazerCartao": { const ids = [...S.lanc.entries()].filter(([,d])=>d.tipo==="pagfatura" && d.fatura===arg && mesDe(d.data)===arg).map(([id,d])=>[id,d]);
      for (const [id] of ids) await apagarLanc(id); toast("Pagamento da fatura desmarcado", async()=>{ for (const [id,d] of ids) await gravarLanc(id, d); }); return; }
    case "adiantarCartao": case "jaAdiantei": { const m0 = cmd==="jaAdiantei" ? addMes(arg,-1) : arg; const CM = cartaoDoMes(m0); const v = cmd==="jaAdiantei" ? r2(sum([...S.lanc.values()].filter(d=>d.aPagar && d.fatura===arg), totalDe)) : CM.adiantar;
      for (const [iid,d] of [...S.lanc.entries()].filter(([,d])=>d.aPagar && d.fatura>m0)){ const nd = Object.assign({}, d); delete nd.aPagar; await gravarLanc(iid, nd); }
      if (!(v>0)) return; const id = uid(); const venc = cmd==="jaAdiantei" ? arg : CM.prox;
      await gravarLanc(id, {tipo:"pagfatura", valor:v, desc:"Adiantamento da fatura", fatura:venc, cat:null, data:hoje(), origem:"adiantamento", criado:Date.now()});
      toast(`Adiantado ${fm(v)} da fatura de ${MES[+venc.slice(5)-1]}`, async()=>{ await apagarLanc(id); toast("Desfeito"); }); return; }
    case "instalarApp": { $("#convApp")?.remove(); if (pedidoInstalar){ pedidoInstalar.prompt(); const r = await pedidoInstalar.userChoice.catch(()=>({})); lsSet("caderneta-instalar", r.outcome==="accepted" ? "feito" : "nao"); pedidoInstalar = null; }
      else toast(/iphone|ipad/i.test(navigator.userAgent) ? "No Safari: toque em Compartilhar e depois em “Adicionar à Tela de Início”." : "No Chrome: toque no menu ⋮ e depois em “Instalar app” ou “Adicionar à tela inicial”.", null, 8000); render(); return; }
    case "naoInstalar": $("#convApp")?.remove(); lsSet("caderneta-instalar","nao"); toast("Combinado, não pergunto mais. Se mudar de ideia, está em Ajustes."); return;
    case "planVal": memo.set("fxPlan", arg); render(); setTimeout(()=>{ const i=$("#planVal"); i?.focus(); i?.select(); },0); return;
    case "confirmaPlanVal": { const v = parseValor($("#planVal")?.value||""); memo.delete("fxPlan"); ((S.cfg.planos ||= {})[m] ||= {})[arg] = v>0 ? v : 0; salvarCfg(true); render(); return; }
    case "editarGuardar": memo.set("fxGuardar", arg); render(); setTimeout(()=>{ const i=$("#guardVal"); i?.focus(); i?.select(); },0); return;
    case "confirmaGuardar": { const txt = ($("#guardVal")?.value||"").trim(); memo.delete("fxGuardar"); ((S.cfg.planos ||= {})[arg] ||= {}); if (!txt) delete S.cfg.planos[arg].__guardar; else S.cfg.planos[arg].__guardar = parseValor(txt)||0; salvarCfg(true); render(); return; }
    case "guardarPlano": { const mt = S.cfg.metas[0]; if (!mt) return; const r = resumo(arg); const v = r2(r.metaMensal - r.guardado);
      if (!(v>0)){ memo.set("fxGuardar", arg); render(); setTimeout(()=>$("#guardVal")?.focus(),0); toast("Quanto quer guardar este mês?"); return; }
      const ids = await lancarParsed({tipo:"aporte", valor:v, desc:mt.nome, meta:mt.id, data: arg===mesDe(hoje()) ? hoje() : dataNoMes(arg, 10), origem:"checklist"});
      toast(`${fm(v)} guardados em ${mt.nome}. Saiu do saldo do mês.`, async()=>{ for (const id of ids) await apagarLanc(id); toast("Desfeito"); }); return; }
    case "guardarAgora": memo.set("guardarAgora", arg); render(); setTimeout(()=>$("#guardAgora")?.focus(),0); return;
    case "confirmaGuardarAgora": { const mt = S.cfg.metas[0]; const v = parseValor($("#guardAgora")?.value||""); memo.delete("guardarAgora"); if (!mt || !(v>0)){ render(); return; }
      const ids = await lancarParsed({tipo:"aporte", valor:v, desc:mt.nome, meta:mt.id, data: arg===mesDe(hoje()) ? hoje() : dataNoMes(arg, 10), origem:"checklist"});
      toast(`${fm(v)} guardados em ${mt.nome}`, async()=>{ for (const id of ids) await apagarLanc(id); toast("Desfeito"); }); return; }
    case "baseAgora": { S.cfg.baseV2 = false; S.baseTentada = false; await tentarBase(true); render(); return; }
    case "planCopiarPlanejados": { const mm = memo.get("planMes"), ant = addMes(mm,-1); const ja = new Set(itensDoMes(mm).map(f=>norm(f.nome))); let n = 0;
      for (const f of (S.cfg.fixos||[]).filter(f=>f.soMes===ant)){ if (ja.has(norm(f.nome))) continue; const id = "f"+uid(); const v = previsto(f, ant); S.cfg.fixos.push(Object.assign({}, f, {id, soMes:mm, valor:v})); ((S.cfg.planos ||= {})[mm] ||= {})[id] = v; n++; }
      salvarCfg(true); folhaPlanejar(mm); toast(n ? `Copiei ${n} ${n>1?"planejados":"planejado"} de ${MES[+ant.slice(5)-1]}.` : "Nada novo para copiar."); return; }
    case "planRapSheet": { planejarRapido($("#planRapSheet")?.value, memo.get("planMes")); folhaPlanejar(memo.get("planMes")); return; }
    case "togEnv": { const f = S.cfg.fixos.find(x=>x.id===arg); if (!f) return; f.env = !f.env; salvarCfg(true); folhaPlanejar(memo.get("planMes")); return; }
    case "planTirarRap": { S.cfg.fixos = S.cfg.fixos.filter(x=>x.id!==arg); salvarCfg(true); render(); return; }
    case "abrirAjuste": memo.set("ajSaldo", arg); render(); setTimeout(()=>$("#ajVal")?.focus(), 30); return;
    case "cancelaAjuste": memo.delete("ajSaldo"); render(); return;
    case "confirmaAjuste": { const m = arg; const txt = ($("#ajVal")?.value||"").trim(); memo.delete("ajSaldo"); if (!txt){ render(); return; }
      const real = parseValor(txt.replace(/^[−-]\s*/,"")) * (/^[−-]/.test(txt) ? -1 : 1); if (!isFinite(real)){ render(); return; }
      const R = resumo(m); const dif = r2(real - R.livre); if (Math.abs(dif) < 0.01){ toast("Já estava batendo."); render(); return; }
      const ex = [...S.lanc.entries()].find(([,d])=>d.tipo==="ajuste" && d.mes===m);
      const data = m===mesDe(hoje()) ? hoje() : m+"-"+String(diasNoMes(m)).padStart(2,"0");
      const antes = ex ? Object.assign({}, ex[1]) : null; const id = ex ? ex[0] : uid();
      const novo = r2((ex ? +ex[1].valor||0 : 0) + dif);
      if (Math.abs(novo) < 0.01 && ex) await apagarLanc(id); else await gravarLanc(id, {tipo:"ajuste", valor:novo, desc:"Ajuste de saldo", data, origem:"ajuste", criado: Date.now()});
      toast(`Ajustado: ${dif>0?"+":"−"}${fm(Math.abs(dif))}. Agora mostra ${fm(real)}.`, async()=>{ if (antes) await gravarLanc(id, antes); else await apagarLanc(id); toast("Desfeito"); }); return; }
    case "limparAjuste": { const ex = [...S.lanc.entries()].filter(([,d])=>d.tipo==="ajuste" && d.mes===arg); for (const [id] of ex) await apagarLanc(id);
      toast("Ajuste removido.", async()=>{ for (const [id,d] of ex) await gravarLanc(id, d); }); return; }
    case "go": S.view = arg; render(); window.scrollTo(0,0); return;
    case "cat": S.view="extrato"; S.ext = {busca:"",tipo:"todos",cat:arg,todos:false}; render(); window.scrollTo(0,0); return;

function dataNoMes(m, dia){ const d = Math.min(Math.max(1, +dia||1), diasNoMes(m)); const atual = mesDe(hoje()); if (m===atual && d > new Date().getDate()) return hoje(); return m+"-"+pad(d); }
async function pagarFixo(f, valor, m){

async function autoFixos(){
  if (S.autoDone || !S.cfg.autoFixos) return; S.autoDone = true;
  const m = mesDe(hoje()), dia = new Date().getDate();
  const R = resumo(m); let n = 0;
  for (const x of R.fixosStatus){
    if (x.pago || x.f.varia || !(+x.f.valor) || !(+x.f.dia) || +x.f.dia > dia || S.cfg.pulados[`${x.f.id}-${m}`]) continue;

async function baixar(nome, conteudo, tipo){

  try{ await S.downloads.save({filename:nome, data:new Blob([conteudo],{type:tipo})}); }catch(e){ if (e?.code!=="cancelled" && e?.code!=="declined") toast("Não deu para baixar agora."); }
}

function adaptadorLocal(){

function adaptadorFirestore(fs, fdb){
  const snapDoc = s => ({id:s.id, exists:s.exists(), data:()=>s.data(), metadata:s.metadata});
  const colRef = path => ({
    doc: id => docRef(path+"/"+id),
    onSnapshot: (next, err) => fs.onSnapshot(fs.collection(fdb, path), {includeMetadataChanges:false}, q=>next({docs:q.docs.map(snapDoc), metadata:q.metadata}), err)
  });
  const docRef = path => ({
    set: data => fs.setDoc(fs.doc(fdb, path), data),
    delete: () => fs.deleteDoc(fs.doc(fdb, path)),
    onSnapshot: (next, err) => fs.onSnapshot(fs.doc(fdb, path), s=>next(snapDoc(s)), err),
    collection: sub => colRef(path+"/"+sub)
  });
  return {doc: docRef};
}
