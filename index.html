  const st = {};
  for (const mm of meses){ const vistos = new Set();
    for (const it of (S.hist[mm].itens||[])){ const bruto = String(it[0]||""); const nome = limpa(bruto); const k = norm(nome); const v = (+it[2]>0 ? +it[2] : +it[3]) || 0;
      if (!k || v<=0 || vistos.has(k) || /dizimo|total|investiment/.test(k)) continue; vistos.add(k);
      (st[k] ||= {nome, bruto, n:0, ult:0}); st[k].n++; st[k].ult = v; } }
  const min = Math.min(6, Math.ceil(meses.length/2));
  const chave = n => norm(n).replace(/[^a-z]/g,"");
  const existentes = (S.cfg.fixos||[]).filter(f=>!f.soMes).map(f=>chave(f.nome));
  let n = 0, poup = 0;
  for (const x of Object.values(st).filter(x=>x.n >= min)){
    const k = chave(x.nome);
    if (/poupan/.test(norm(x.nome))){ poup = x.ult; continue; }
    if (existentes.some(e => e===k || e.startsWith(k) || k.startsWith(e))) continue;
    const env = ENV_RE.test(norm(x.nome));
    (S.cfg.fixos ||= []).push({id:"f"+uid(), nome:x.nome, valor:Math.round(x.ult), dia:0, cat: categorizar(x.bruto) || categorizar(x.nome) || "outros", varia:true, daPlanilha:true, ...(env?{env:true}:{})}); n++; existentes.push(k); }
  for (const f of S.cfg.fixos||[]) if (!f.soMes && f.env===undefined && ENV_RE.test(norm(f.nome))) f.env = true;
  const mt = (S.cfg.metas||[])[0]; if (mt && poup && !(+mt.aporteMensal)) mt.aporteMensal = Math.round(poup);
  S.cfg.baseV1 = true; S.cfg.baseV2 = true; if (S.cfg.dizimo) S.cfg.dizimo.ativo = false;
  salvarCfg(true);
  if (n || forcar) toast(n ? `Trouxe ${n} gastos fixos da sua planilha para o plano${poup?` e ${fm0(poup)} por mês para guardar`:""}. Ajuste o que mudou.` : "Os fixos da planilha já estavam no plano.", null, 8000);
}
function conectar(db, base){
  desligar.forEach(f => { try{ f(); }catch(e){} }); desligar = [];
  S.lanc = new Map(); S.hist = {}; S.cfg = clone(CFG_PADRAO); S.baseTentada = false; S.cfgExists = false; S.gotLanc = false; S.gotCfg = false; S.lancServidor = false; S.autoDone = false;
  S.db = db; S.online = true; if (!S.visitante) $("#banner").innerHTML = "";
  cfgRef = db.doc(base);
  lancCol = cfgRef.collection("lanc");
  histCol = cfgRef.collection("hist");
  desligar.push(cfgRef.onSnapshot(snap=>{
    S.gotCfg = true;
    if (snap.exists){ if (!cfgWriting && !cfgDirty){ S.cfg = Object.assign(clone(CFG_PADRAO), clone(snap.data())); S.cfg.regras ||= {}; S.cfg.pulados ||= {}; } S.cfgExists = true; }
    render(); tentarBase(); if (S.lancServidor && !snap.metadata.fromCache) autoFixos();
  }, ()=>{ S.gotLanc = true; render(); banner(S.modo==="firebase" ? "O Firebase recusou o acesso aos dados. Confira as regras do Firestore (coleção caderneta)." : "Não consegui ler seus dados. Recarregue a página."); }));
  desligar.push(lancCol.onSnapshot(snap=>{
    S.lanc = new Map(snap.docs.map(d=>{ const x = d.data(); if (x && x.cartao && x.tipo==="gasto") x.mes = mesEfetivo(x); return [d.id, x]; }));
    S.gotLanc = true; S.lancServidor = S.lancServidor || !snap.metadata.fromCache;
    render(); if (S.gotCfg && S.lancServidor) autoFixos();
  }, e=>{ S.gotLanc = true; render(); banner(S.modo==="firebase" ? "O Firebase recusou o acesso aos dados. Confira as regras do Firestore (coleção caderneta)." : "A sincronização caiu. Recarregue a página."); }));
  desligar.push(histCol.onSnapshot(snap=>{ const h = {}; for (const d of snap.docs) h[d.id] = d.data(); S.hist = h; render(); tentarBase(); }, ()=>{}));
}
async function importarBackup(txt){
  let b; try{ b = JSON.parse(txt); }catch(e){ toast("Esse arquivo não é um backup da Caderneta."); return; }
  if (!b.cfg){ toast("Esse arquivo não é um backup da Caderneta."); return; }
  if (!S.db){ toast("Entre na sua conta antes de importar."); return; }
  toast("Importando…", null, 60000);
  try{
    S.cfg = Object.assign(clone(CFG_PADRAO), b.cfg); await cfgRef.set(clone(S.cfg));
    const L = Object.entries(b.lancamentos||{}); for (const [id,d] of L) await lancCol.doc(id).set(d);
    const H = Object.entries(b.historico||{}); for (const [id,d] of H) await histCol.doc(id).set(d);
    toast(`Backup importado: ${L.length} lançamentos e ${H.length} meses de histórico`); S.baseTentada = false; setTimeout(tentarBase, 1500);
  }catch(e){ toast("A importação parou no meio. Tente de novo."); }
}
function banner(t){ $("#banner").innerHTML = `<div class="banner">${esc(t)}</div>`; }

render();
iniciar();
setTimeout(() => { if (S.online===null || (S.db && !S.gotLanc)){ S.travou = true; render(); } }, 12000);
})();
</script>
